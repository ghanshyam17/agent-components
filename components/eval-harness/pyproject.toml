[project]
name = "eval-harness"
version = "0.1.0"
description = "Dataset-driven evaluation for AI/agent systems: load examples, run an async target, score with metrics (incl. an LLM-judge), produce a report."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghanshyam" }]
license = { text = "MIT" }
dependencies = [
    "components-core",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
eval-harness = "eval_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_harness"]