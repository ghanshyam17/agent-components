[project]
name = "memory-store"
version = "0.1.0"
description = "Pluggable memory for AI agents: short-term session memory + long-term vector memory, with in-memory and Redis backends."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghanshyam" }]
license = { text = "MIT" }
dependencies = [
    "components-core",
    "pydantic>=2.6",
    "httpx>=0.27",
    "openai>=1.40",      # for the OpenAI-compatible embedding client (vLLM/embeddings)
    "numpy>=1.26",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_store"]