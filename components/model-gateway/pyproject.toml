[project]
name = "model-gateway"
version = "0.1.0"
description = "An OpenAI-compatible inference gateway over vLLM/TGI/Ollama/cloud with load balancing, fallback, retries and rate limits."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghanshyam" }]
license = { text = "MIT" }
dependencies = [
    "components-core",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_gateway"]