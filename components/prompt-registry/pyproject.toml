[project]
name = "prompt-registry"
version = "0.1.0"
description = "Versioned, templated prompt management with hot-reload and a simple A/B resolver."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghanshyam" }]
license = { text = "MIT" }
dependencies = [
    "components-core",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_registry"]