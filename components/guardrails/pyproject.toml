[project]
name = "guardrails"
version = "0.1.0"
description = "Input/output safety for LLM apps: keyword filtering, PII redaction, prompt-injection detection, length limits and output schema validation, composable as a pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghanshyam" }]
license = { text = "MIT" }
dependencies = [
    "components-core",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
jsonschema = ["jsonschema>=4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrails"]