[project]
name = "distillation"
version = "0.1.0"
description = "Synthetic data generation and LLM distillation: mine teacher reasoning traces, curate them through safety and quality gates, distil into a small student model, and measure teacher/student parity before serving."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghanshyam" }]
license = { text = "MIT" }
dependencies = [
    # Foundational components — consumed, never duplicated.
    "components-core",
    "model-gateway",
    "prompt-registry",
    "guardrails",
    "eval-harness",
    "memory-store",
    "retriever",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Azure AI Foundry distillation / fine-tuning. Absent by default so CI and local
# development run deterministically against the mock runner.
azure = [
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.17.0",
    "azure-ai-ml>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distillation"]
