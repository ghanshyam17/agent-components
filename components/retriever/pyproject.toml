[project]
name = "retriever"
version = "0.1.0"
description = "A RAG building block: chunk, embed, recall and rerank — built on memory-store's VectorMemory."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ghanshyam" }]
license = { text = "MIT" }
dependencies = [
    "components-core",
    "memory-store",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retriever"]