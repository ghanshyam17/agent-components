apiVersion: agentcomponents/v1
kind: Project
metadata:
  name: {{ project_name }}
spec:
  foundry:
    hub_name: my-foundry-resource
    project_name: {{ project_name }}-project
  agents:
    - agent.yaml
  environments:
    dev:
      tags: { env: dev, pattern: autogen }
    prod:
      tags: { env: prod, pattern: autogen }
