apiVersion: agentcomponents/v1
kind: Agent
metadata:
  name: quality-supervisor
  project: frenchcase
  description: "Reviews output, ensures TEF-grade quality, requests revisions"
spec:
  pattern: react
  model:
    provider: azure-foundry
    deployment_name: gpt-4o          # supervisor needs the capable model
    tier_strategy:
      lower: { deployment: gpt-4o-mini, alias: lower }
      higher: { deployment: gpt-4o, alias: higher }
  tools:
    builtin: []
    custom: []
  memory:
    session: { backend: in-memory, ttl: 3600 }
    vector: null
  guardrails:
    input_filters: []
    output_filters:
      - hallucination_check
  infrastructure:
    compute_target: functions
    sku: consumption
    scaling: { min: 0, max: 2 }