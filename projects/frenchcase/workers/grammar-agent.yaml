apiVersion: agentcomponents/v1
kind: Agent
metadata:
  name: grammar-agent
  project: frenchcase
  description: "Extracts grammar points from the topic/context"
spec:
  pattern: react
  model:
    provider: azure-foundry
    deployment_name: gpt-4o-mini
    tier_strategy:
      lower: { deployment: gpt-4o-mini, alias: lower }
      higher: { deployment: gpt-4o, alias: higher }
  tools:
    builtin: []
    custom:
      - name: repo_search
        source_file: ./tools/learncase_tools.py
        function_name: repo_search
  memory:
    session: { backend: in-memory, ttl: 3600 }
    vector: { backend: ai-search, index_name: tef-learning }
  infrastructure:
    compute_target: functions
    sku: consumption
    scaling: { min: 0, max: 2 }